<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="50%" stop-color="#00ffb3" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shape (Sleek Rounded Square) -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="#020705" stroke="url(#logo-grad)" stroke-width="2" />
  
  <!-- Outer glowing path -->
  <path d="M 25 70 C 25 70, 35 45, 50 45 C 65 45, 75 70, 75 70" fill="none" stroke="url(#logo-grad)" stroke-width="6" stroke-linecap="round" />
  <path d="M 35 70 C 35 70, 42 55, 50 55 C 58 55, 65 70, 65 70" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />
  
  <!-- AI Core Core Dot -->
  <circle cx="50" cy="30" r="10" fill="url(#logo-grad)" filter="url(#glow)" />
  <circle cx="50" cy="30" r="4" fill="#ffffff" />
</svg>